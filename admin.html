<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理画面 V59</title>
  <link rel="stylesheet" href="admin.css?v=59">
</head>
<body>
<main>
  <header>
    <div>
      <small>ADMIN / TREASURE CLICK</small>
      <h1>運営管理</h1>
      <p>賞金プールと交換申請を管理します。</p>
    </div>
    <a href="index.html">← ゲームへ</a>
  </header>

  <section id="gate" class="card">
    <b>管理者権限を確認中…</b>
    <p id="gateMsg">Googleログイン済みの管理者のみ利用できます。</p>
  </section>

  <section id="panel" hidden>
    <section class="pool-section">
      <div class="section-head">
        <div>
          <small>PRIZE POOL</small>
          <h2>💰 賞金プール</h2>
          <p>現在は管理・表示のみ。宝箱の抽選ロジックにはまだ接続していません。</p>
        </div>
        <button id="poolReload" class="dark-btn">更新</button>
      </div>

      <div class="pool-summary">
        <div class="card pool-main">
          <small>総賞金</small>
          <b id="poolTotal">—</b>
          <span>初期原資</span>
        </div>
        <div class="card">
          <small>未配置</small>
          <b id="poolUnallocated">—</b>
          <span>これから島へ配置</span>
        </div>
        <div class="card">
          <small>配置中</small>
          <b id="poolAllocated">—</b>
          <span>島に眠っている賞金</span>
        </div>
        <div class="card">
          <small>発掘済み</small>
          <b id="poolDiscovered">—</b>
          <span>ユーザーが獲得済み</span>
        </div>
      </div>

      <div class="inventory card">
        <div class="inventory-head">
          <div>
            <small>INVENTORY</small>
            <h3>賞金内訳</h3>
          </div>
          <span id="poolCount">—</span>
        </div>
        <div id="poolInventory" class="inventory-grid">
          <div class="inventory-loading">読み込み中…</div>
        </div>
      </div>
    </section>

    <section class="redemption-section">
      <div class="section-head redemption-head">
        <div>
          <small>REDEMPTION</small>
          <h2>交換申請</h2>
          <p>PayPay送金後に「支払済み」にしてください。</p>
        </div>
      </div>
      <div class="summary">
        <div class="card"><small>処理待ち</small><b id="pendingCount">—</b></div>
        <div class="card"><small>支払済み</small><b id="paidCount">—</b></div>
        <button id="reload">更新</button>
      </div>
      <div id="requests" class="requests"></div>
    </section>
  </section>

  <div id="error" class="error" hidden></div>
</main>
<script src="admin.js?v=59"></script>
</body>
</html>
