<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EASY島｜CLICK TREASURE</title>
<link rel="stylesheet" href="island.css?v=88-24">
</head>
<body>
<main class="island-page">
  <header class="island-top">
    <a class="back" href="index.html#islandSelect">← 島選択に戻る</a>
    <div class="brand"><span class="brand-chest">▣</span><b>CLICK <em>TREASURE</em></b></div>
  </header>

  <section class="easy-hero">
    <div class="hero-shade"></div>
    <div class="hero-copy">
      <span class="eyebrow">TREASURE ISLAND</span>
      <h1>EASY島 <small id="generation">#—</small></h1>
      <p>南の楽園の小さな島</p>
      <div class="chips">
        <span>🏝️ 100マス</span>
        <span>🎁 宝30個</span>
        <span>⭐ 初心者向け</span>
      </div>
    </div>
  </section>

  <section class="treasure-panel">
    <div class="map-head">
      <div>
        <span class="map-kicker">TREASURE MAP</span>
        <h2>🗺️ 宝箱マップ <small>タップして宝箱を開けよう！</small></h2>
      </div>
      <div class="map-count">🧰 残り <strong>37</strong> / 100マス</div>
    </div>
    <div class="chest-board" id="chestBoard" aria-label="EASY島 100マス宝箱マップ"></div>
    <div class="map-foot">
      <div><b>この島の報酬</b><span>🪙 10P　🪙 100P　🌟 1,000P</span></div>
      <div class="energy-preview"><b>⚡ エネルギー</b><strong>20 / 20</strong></div>
    </div>
  </section>
</main>
<script>
const p=new URLSearchParams(location.search);
document.getElementById("generation").textContent="#"+(p.get("generation")||"—");

const board=document.getElementById("chestBoard");
const demoRemaining=new Set([0, 3, 6, 9, 12, 15, 17, 18, 21, 24, 27, 30, 33, 36, 39, 42, 45, 48, 51, 54, 55, 57, 60, 63, 66, 69, 72, 75, 78, 81, 82, 84, 87, 90, 93, 96, 99]);
for(let i=0;i<100;i++){
  const cell=document.createElement("button");
  cell.type="button";
  cell.className="demo-chest"+(demoRemaining.has(i)?"":" demo-dug");
  cell.setAttribute("aria-label",demoRemaining.has(i)?`宝箱 ${i+1}`:`発掘済み ${i+1}`);
  if(demoRemaining.has(i)){
    cell.innerHTML='<img src="./assets/easy-chest-closed-v88.webp" alt="" draggable="false">';
  }
  board.appendChild(cell);
}
</script>
</body>
</html>
