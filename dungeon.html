<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダンジョン | CLICK TREASURE</title>
  <link rel="stylesheet" href="dungeon.css?v=1">
</head>

<body>

  <main class="dungeon-page">

    <header class="dungeon-header">
      <button
        class="back-button"
        type="button"
        onclick="location.href='characters.html'"
      >
        ← 戻る
      </button>

      <div>
        <div class="dungeon-label">CLICK TREASURE</div>
        <h1>ダンジョン</h1>
      </div>
    </header>

    <section class="dungeon-status">
      <div>
        <span>FLOOR</span>
        <strong id="floorNumber">1</strong>
      </div>

      <div>
        <span>DISTANCE</span>
        <strong id="distanceNumber">0m</strong>
      </div>
      <div class="dev-speed"><span>DEV SPEED</span><div><button type="button" class="speed-btn active" data-speed="1">×1</button><button type="button" class="speed-btn" data-speed="2">×2</button><button type="button" class="speed-btn" data-speed="3">×3</button></div></div>
    </section>

    <section class="dungeon-screen">

      <div id="dungeonViewport" class="dungeon-viewport">

        <div class="dungeon-bg dungeon-bg-far"></div>
        <div class="dungeon-bg dungeon-bg-mid"></div>
        <div class="dungeon-bg dungeon-bg-near"></div>

        <div id="dungeonWorld" class="dungeon-world">

          <div class="dungeon-ground"></div>

          <div id="dungeonPlayer" class="dungeon-player">
            <div class="placeholder player-placeholder">
              PLAYER
            </div>

            <div class="player-info">
              <strong id="playerName">冒険者</strong>

              <div class="hp-bar">
                <div id="playerHpBar" class="hp-bar-fill"></div>
              </div>

              <span id="playerHpText">HP 100 / 100</span>
            </div>
          </div>

          <div id="dungeonEnemy" class="dungeon-enemy">
            <div class="placeholder enemy-placeholder">
              ENEMY
            </div>
          </div>

        </div>

      </div>

      <div class="dev-speed"><span>DEV SPEED</span><div><button type="button" class="speed-btn active" data-speed="1">×1</button><button type="button" class="speed-btn" data-speed="2">×2</button><button type="button" class="speed-btn" data-speed="3">×3</button></div></div>
    </section>

    

    <button id="nextRoomButton" class="next-room-button" type="button" hidden>次の部屋へ →</button>

    <div id="battleLog" class="battle-log">
  <div id="battleMessage" class="battle-message">
    ダンジョン探索開始！
  </div>
</div>

  
<section class="dungeon-dev-skills">
  <span>DEV ONLY</span>
  <h3>スキルテスト</h3>

  <div class="dev-skill-buttons">
    <button type="button" data-dev-skill="fire_lizard">
      🔥 ファイアリザード
    </button>

    <button type="button" data-dev-skill="forest_spirit">
      🌿 森の精霊
    </button>

    <button type="button" data-dev-skill="mimic">
      🎁 ミミック
    </button>
  </div>
</section>
</main>

  <script src="dungeon.js?v=4"></script>

<!-- Dungeon Result -->
<div id="dungeonResult" class="dungeon-result" hidden>
  <div class="dungeon-result-backdrop"></div>

  <div class="dungeon-result-card">
    <span class="result-label">EXPEDITION RESULT</span>

    <h2 id="resultTitle">🏆 1階層クリア！</h2>

    <div class="result-stats">
      <div>
        <span>到達距離</span>
        <strong id="resultDistance">0m</strong>
      </div>

      <div>
        <span>撃破数</span>
        <strong id="resultKills">0体</strong><div><span>獲得EXP</span><strong id="resultExp">0 EXP</strong></div>
      </div>
    </div>

    <div id="resultPartyExp" class="result-party-exp"></div>

    <button id="returnButton" type="button">
      🏠 帰還する
    </button>
  </div>
</div>
</body>
</html>
