<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダンジョン | CLICK TREASURE</title>
  <link rel="stylesheet" href="dungeon.css?v=1">
</head>

<body>

  <main class="dungeon-page">

    <header class="dungeon-header">
      <button
        class="back-button"
        type="button"
        onclick="location.href='dungeon-menu.html'"
      >
        ← 戻る
      </button>

      <div>
        <div class="dungeon-label">CLICK TREASURE</div>
        <h1>ダンジョン</h1>
      </div>
    </header>

    <section class="dungeon-status">
      <div>
        <span>FLOOR</span>
        <strong id="floorNumber">1</strong>
      </div>

      <div>
        <span>DISTANCE</span>
        <strong id="distanceNumber">0m</strong>
      </div>
      <div class="dev-speed"><span>DEV SPEED</span><div><button type="button" class="speed-btn active" data-speed="1">×1</button><button type="button" class="speed-btn" data-speed="2">×2</button><button type="button" class="speed-btn" data-speed="3">×3</button></div></div>
    </section>

    <section class="dungeon-screen">

      <div id="dungeonViewport" class="dungeon-viewport">

        <div class="dungeon-bg dungeon-bg-far"></div>
        <div class="dungeon-bg dungeon-bg-mid"></div>
        <div class="dungeon-bg dungeon-bg-near"></div>

        <div id="dungeonWorld" class="dungeon-world">

          <div class="dungeon-ground"></div>

          <div id="dungeonPlayer" class="dungeon-player">
            <div class="placeholder player-placeholder">
              PLAYER
            </div>

            <div class="player-info">
              <strong id="playerName">冒険者</strong>

              <div class="hp-bar">
                <div id="playerHpBar" class="hp-bar-fill"></div>
              </div>

              <span id="playerHpText">HP 100 / 100</span>
            </div>
          </div>

          <div id="dungeonEnemy" class="dungeon-enemy">
            <div class="placeholder enemy-placeholder">
              ENEMY
            </div>
          </div>

        </div>

      </div>

      <div class="dev-speed"><span>DEV SPEED</span><div><button type="button" class="speed-btn active" data-speed="1">×1</button><button type="button" class="speed-btn" data-speed="2">×2</button><button type="button" class="speed-btn" data-speed="3">×3</button></div></div>
    </section>

    

    <button id="nextRoomButton" class="next-room-button" type="button" hidden>次の部屋へ →</button>

    <section id="heroHud" class="hero-hud">
      <div class="hero-hud-top">
        <div>
          <span class="hero-label">HERO</span>
          <strong>勇者</strong>
        </div>

        <div class="hero-level">
          Lv.<strong id="heroLevel">1</strong>
        </div>

        <div class="hero-coin">
          COIN <strong id="heroCoin">0</strong>
        </div>
      </div>

      <div class="hero-hp-area">
        <div class="hero-hp-text">
          <span>HP</span>
          <strong><span id="heroHp">100</span> / <span id="heroMaxHp">100</span></strong>
        </div>
        <div class="hero-hp-bar">
          <div id="heroHpFill" class="hero-hp-fill"></div>
        </div>
      </div>

      <div class="hero-stats">
        <div>
          <span>ATK</span>
          <strong id="heroAttack">15</strong>
        </div>

        <button id="heroLevelUpButton" class="hero-levelup-button" type="button">
          <strong>LEVEL UP</strong>
          <span id="heroLevelUpCost">20 COIN</span>
        </button>
      </div>

      <div class="hero-actions">
        <button id="heroAttackButton" type="button">攻撃</button>
        <button id="heroSkillButton" type="button" disabled>スキル</button>
        <button id="heroEquipmentButton" type="button">装備</button>
      </div>
    </section>
    <div id="battleLog" class="battle-log">
  <div id="battleMessage" class="battle-message">
    ダンジョン探索開始！
  </div>
</div>
</main>



<!-- Dungeon Result -->
<div id="dungeonResult" class="dungeon-result" hidden>
  <div class="dungeon-result-backdrop"></div>

  <div class="dungeon-result-card">
    <span class="result-label">EXPEDITION RESULT</span>

    <h2 id="resultTitle">🏆 1階層クリア！</h2>

    <div class="result-stats">
      <div>
        <span>到達距離</span>
        <strong id="resultDistance">0m</strong>
      </div>

      <div>
        <span>撃破数</span>
        <strong id="resultKills">0体</strong><div><span>獲得EXP</span><strong id="resultExp">0 EXP</strong></div>
      </div>
    </div>

    <div id="resultPartyExp" class="result-party-exp"></div>

    <div id="resultEquipmentDrop" class="result-equipment-drop" hidden>
      <span class="result-equipment-label">EQUIPMENT DROP</span>

      <div class="result-equipment-compare">
        <div class="result-equipment-current">
          <span>現在の武器</span>
          <strong id="resultCurrentWeapon">なし</strong>
          <small id="resultCurrentWeaponStat">ATK +0</small>
        </div>

        <div class="result-equipment-arrow">→</div>

        <div class="result-equipment-new">
          <span>ドロップ</span>
          <strong id="resultDroppedWeapon">---</strong>
          <small id="resultDroppedWeaponStat">ATK +0</small>
        </div>
      </div>

      <div class="result-equipment-actions">
        <button id="keepCurrentWeaponButton" type="button">入れ替えない</button>
        <button id="equipDroppedWeaponButton" type="button">入れ替える</button>
      </div>
    </div>
    <button id="returnButton" type="button">
      🏠 帰還する
    </button>
  </div>
</div>
<!-- Hero Equipment -->
<div id="heroEquipmentPanel" class="hero-equipment-panel" hidden>
  <div class="hero-equipment-backdrop"></div>

  <div class="hero-equipment-card">
    <div class="hero-equipment-header">
      <div>
        <span class="hero-equipment-label">HERO EQUIPMENT</span>
        <h2>装備</h2>
      </div>

      <button id="heroEquipmentCloseButton" type="button">×</button>
    </div>

    <div id="heroEquipmentList" class="hero-equipment-list">
      <p class="hero-equipment-empty">装備を所持していません</p>
    </div>
  </div>
</div>
  <script src="dungeon.js?v=5"></script>
</body>
</html>
